[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otto-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "otto-core",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
