[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otto-core"
version = "0.1.0"
description = "Core OTTO: PNCP, normalização, nicho, score, SQLite"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "pytesseract>=0.3.10",
  "Pillow>=10.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# OCR também exige o binário Tesseract no SO (idioma por) — ver docs/OCR.md.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
