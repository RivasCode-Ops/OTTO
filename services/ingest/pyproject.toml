[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otto-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["otto-core", "click>=8.1"]

[project.scripts]
otto = "otto_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
